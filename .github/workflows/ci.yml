name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/variant-copilot/backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # No network and no OpenAI key: the LLM and the tools are faked.
      - run: uv run pytest
      # Tool parsers against the versioned HTTP cache (fails if a request is not cached).
      - run: uv run python scripts/check_tools.py
        env:
          OFFLINE: "1"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26 # same as the devcontainer image
      # Node 25+ no longer ships Corepack (same as in the devcontainer): install it, then
      # let it provide the Yarn version pinned in package.json. Its shims land in
      # setup-node's bin dir, which comes before the runner's global Yarn 1 in PATH.
      - run: npm install -g corepack && corepack enable
      - run: yarn install --immutable
      - run: yarn workspace frontend lint
      - run: yarn workspace frontend format:check
      - run: yarn workspace frontend typecheck
