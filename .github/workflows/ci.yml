name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/variant-copilot/backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # No network and no OpenAI key: the LLM and the tools are faked.
      - run: uv run pytest
      # Tool parsers against the versioned HTTP cache (fails if a request is not cached).
      - run: uv run python scripts/check_tools.py
        env:
          OFFLINE: "1"

  frontend:
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0" # download the pinned Yarn without asking
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26 # same as the devcontainer image
          # setup-node v5 caches automatically from the packageManager field, which
          # runs the runner's global Yarn 1 before Corepack exists: turn that off.
          package-manager-cache: false
      # Node 25+ no longer ships Corepack (same as in the devcontainer): install it.
      - run: npm install -g corepack
      # "corepack yarn" runs the Yarn pinned in package.json (4.18.1), whatever
      # "yarn" means on the runner's PATH (a global Yarn 1).
      - run: corepack yarn --version
      - run: corepack yarn install --immutable
      - run: corepack yarn workspace frontend lint
      - run: corepack yarn workspace frontend format:check
      - run: corepack yarn workspace frontend typecheck
