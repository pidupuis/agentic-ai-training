[project]
name = "variant-copilot"
version = "0.1.0"
description = "Agent that annotates tumor variants from Ensembl and PubMed"
authors = [{ name = "Pierre Dupuis 井磊", email = "pidupuis@users.noreply.github.com" }]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.165.0",
  "httpx>=0.28.1",
  "openai>=3.58.0",
  "pydantic>=2.14.4",
  "python-dotenv>=1.2.4",
  "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=9.2.0"]

[tool.pytest.ini_options]
# Tests import the app package ("from app.agent import ..."): put backend/ on the path.
pythonpath = ["."]
testpaths = ["tests"]
